name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CC=${{ matrix.cc }}

      - name: Test
        run: make CC=${{ matrix.cc }} test

      - name: Upload binary
        if: matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: gale-linux-x86_64
          path: build/gale

  windows:
    name: Windows (MinGW-w64 gcc)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gale-windows-x86_64
          path: build/gale.exe

  # ELF / PE の出力ができたら、ここに「生成した実行ファイルを各 OS 上で
  # 実際に動かす」ステップを追加する(linux ジョブで ELF、windows ジョブで PE)。
